spring.application.name=demo

server.port=8082
camel.springboot.name=MyCamel
timer.period=2000
management.endpoints.web.exposure.include=info, health, camelroutes
management.endpoint.health.probes.enabled=true
management.endpoint.camelroutes.access=unrestricted
spring.main.allow-bean-definition-overriding=true
camel.debug.enabled = true
camel.debug.jmx-connector-enabled = true
camel.debug.jmx-connector-port = 1099


#Log
camel.endpoint.log.error = log:com.camel?level=ERROR&showAll=true&showStackTrace=true&multiline=true&maxChars=200000

#Connessioni db
camel.db.jdbcurl=${ENV_JDBC_URL}
camel.db.username=${ENV_JDBC_USERNAME}
camel.db.password=${ENV_JDBC_PASSWORD}
camel.db.driverClassName=${ENV_DRIVER_CLASS_NAME}
camel.db.maximumPoolSize=${ENV_MAXIMUM_POOL_SIZE}
camel.db.minimumIdle=${ENV_MINIMUM_IDLE}
#Directory per scrittura file
camel.endpoint.file.output=file://${ENV_OUTPUT_DIRECTORY}

#Queries
camel.endpoint.sql.inserisciCliente=sql:insert into "camel"."CLIENTI" ("NOME", "COGNOME", "DATA_DI_NASCITA", "CF", "EMAIL") VALUES (:#nome, :#cognome, :#dataDiNascita, :#cf, :#email)?dataSource=#CAMEL
camel.endpoint.sql.recuperaDatiCliente=sql: select * from "camel"."CLIENTI" where "CF"=:#cf?dataSource=#CAMEL
camel.endpoint.sql.recuperaCliente=sql:select * from "camel"."CLIENTI" where "CODICE_CLIENTE"=:#codiceCliente?dataSource=#CAMEL&outputType=SelectOne&outputClass=com.camel.demo.datasource.beans.CLIENTI
camel.endpoint.sql.eliminaCliente=sql:delete from "camel"."CLIENTI" where "CODICE_CLIENTE"=:#codiceCliente?dataSource=#CAMEL
camel.endpoint.sql.aggiornaCliente=sql:update "camel"."CLIENTI" set "NOME"=:#nome, "COGNOME"=:#cognome, "DATA_DI_NASCITA"=:#dataDiNascita, "CF"=:#cf, "EMAIL"=:#email where "CODICE_CLIENTE"=:#codiceCliente?dataSource=#CAMEL
camel.endpoint.sql.esisteCliente=sql: select count(*) from "camel"."CLIENTI" where "CODICE_CLIENTE"=:#codiceCliente?dataSource=#CAMEL&outputType=SelectOne
camel.endpoint.sql.inserisciPratica=sql:insert into "camel"."PRATICHE" ("IMPORTO", "DESCRIZIONE", "CODICE_CONTRAENTE","DATA_SOTTOSCRIZIONE", "STATO_PRATICA") values (:#importo, :#descrizione, :#codiceContraente, :#dataSottoscrizione, :#statoPratica)?dataSource=#CAMEL
camel.endpoint.sql.recuperaPratica=sql:select * from "camel"."PRATICHE" where "CODICE_PRATICA"=:#codicePratica and "DATA_CANCELLAZIONE" is null?dataSource=#CAMEL&outputType=SelectOne&outputClass=com.camel.demo.datasource.beans.PRATICHE
camel.endpoint.sql.eliminaPratica=sql:update "camel"."PRATICHE" set "DATA_CANCELLAZIONE"=current_date where "CODICE_PRATICA"=:#codicePratica and "DATA_CANCELLAZIONE" is null?dataSource=#CAMEL
camel.endpoint.sql.aggiornaPratica=sql:update "camel"."PRATICHE" set "IMPORTO"=:#importo, "DESCRIZIONE"=:#descrizione, "CODICE_CONTRAENTE"=:#codiceContraente,"DATA_SOTTOSCRIZIONE"=:#dataSottoscrizione, "STATO_PRATICA"=:#statoPratica where "CODICE_PRATICA"=:#codicePratica and "DATA_CANCELLAZIONE" is null?dataSource=#CAMEL
camel.endpoint.sql.inserisciEsito=sql:insert into "camel"."ESITI_ELABORAZIONI" ("CODICE_PRATICA", "ESITO", "MESSAGGIO_ERRORE", "NOME_FILE") values (:#codicePratica, :#esito, :#messaggioErrore, :#nomeFile)?dataSource=#CAMEL
camel.endpoint.sql.aggiornaStatoPratica=sql:update "camel"."PRATICHE" set "STATO_PRATICA"=:#statoPratica where "CODICE_PRATICA"=:#codicePratica?dataSource=#CAMEL

#ENdpoint per servizio mockato
#camel.endpoint.servizioMockato=http://localhost:8081/cliente/verifica/
camel.endpoint.servizioMockato=http://wiremock:8080/cliente/verifica/
